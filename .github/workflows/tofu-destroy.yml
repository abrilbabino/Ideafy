name: 'OpenTofu Destroy'

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  tofu-destroy:
    name: 'Tofu Destroy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        continue-on-error: true
        with:
          cluster_name: systeam-gke-cluster
          location: us-central1

      - name: Delete Ingress to clean up GCP resources
        continue-on-error: true
        run: |
          kubectl delete ingress --all --all-namespaces || true
          echo "Esperando 60s para que Google Cloud elimine los NEGs y Load Balancers..."
          sleep 60

      - name: Tofu Init
        run: tofu init

      - name: Tofu Destroy
        run: tofu destroy -auto-approve
